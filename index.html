<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn - The Voice Diên Hồng</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap');
        body {
            margin: 0; padding: 0;
            background: url('bg.jpg') no-repeat center top fixed;
            background-size: cover;
            font-family: 'Montserrat', sans-serif;
            color: #fff; height: 100vh; overflow: hidden;
        }
        .overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 10%, rgba(0,0,0,0.9) 100%);
            z-index: 1; pointer-events: none;
        }
        .layout {
            position: relative; z-index: 2;
            display: flex; flex-direction: column;
            height: 100%; width: 100%; max-width: 1200px; margin: 0 auto;
        }
        .top-spacer { flex: 0.9; } /* Dành khoảng trống phía trên cho Logo */
        .main-content {
            flex: 1.1; display: flex; justify-content: center; align-items: flex-start;
            gap: 50px; padding: 0 20px;
        }
        .wheel-wrapper { position: relative; width: 500px; height: 500px; }
        canvas {
            width: 100%; height: 100%; border-radius: 50%;
            border: 12px solid #FFD700;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.5), inset 0 0 30px rgba(0,0,0,0.8);
            background: #000;
        }
        .pointer {
            position: absolute; top: 50%; right: -50px;
            transform: translateY(-50%) rotate(-90deg);
            width: 100px; height: 140px; z-index: 20; transform-origin: center;
        }
        .pointer svg { width: 100%; height: 100%; filter: drop-shadow(0px 0px 10px rgba(255,215,0,0.8)); }
        .spin-btn {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100px; height: 100px; border-radius: 50%;
            background: radial-gradient(circle, #FFDF00, #DAA520);
            border: 6px solid #FFF; color: #8B0000;
            font-weight: 900; font-size: 24px; cursor: pointer;
            box-shadow: 0 0 25px rgba(0,0,0,0.7); z-index: 15;
            transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px;
        }
        .spin-btn:hover { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 35px rgba(255, 215, 0, 0.9); }
        .spin-btn:active { transform: translate(-50%, -50%) scale(0.95); }
        
        .sidebar { width: 380px; display: flex; flex-direction: column; gap: 15px; }
        .panel {
            background: rgba(15, 0, 0, 0.85); backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 215, 0, 0.5); border-radius: 15px;
            padding: 15px 20px; display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
        }
        .panel h2 {
            color: #FFD700; text-align: center; margin: 0; font-size: 1.1em;
            border-bottom: 1px dashed rgba(255, 215, 0, 0.3); padding-bottom: 10px; text-transform: uppercase;
        }
        .panel h2 span { background: #8B0000; padding: 2px 8px; border-radius: 10px; color: #fff; font-size: 0.9em; }
        textarea {
            width: 100%; height: 160px; background: rgba(0,0,0,0.5); color: #FFF;
            border: 1px solid rgba(255,215,0,0.3); border-radius: 8px; padding: 10px;
            font-size: 1.1em; font-family: inherit; line-height: 1.5; resize: none; outline: none; box-sizing: border-box;
        }
        textarea:focus { border-color: #FFD700; }
        .btn-action {
            background: linear-gradient(90deg, #8B0000, #E63946); color: #FFF;
            border: 1px solid #FFD700; padding: 12px; font-size: 1em; font-weight: bold;
            border-radius: 10px; cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }
        .btn-action:hover { background: linear-gradient(90deg, #E63946, #FF4500); box-shadow: 0 0 15px rgba(255,69,0,0.5); }
        .btn-success { background: linear-gradient(90deg, #136a8a, #267871); border-color: #48c6ef; }
        .btn-success:hover { background: linear-gradient(90deg, #267871, #48c6ef); box-shadow: 0 0 15px rgba(72,198,239,0.5); }
        
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(8px);
        }
        .modal.active { display: flex; animation: fadeIn 0.3s; }
        .modal-content {
            background: linear-gradient(145deg, #4a0000, #1a0000); padding: 50px 70px;
            border-radius: 20px; border: 4px solid #FFD700; text-align: center;
            transform: scale(0.8); animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { to { transform: scale(1); } }
        .glow-text { color: #FFD700; text-shadow: 0 0 15px rgba(255,215,0,0.8); font-size: 2.2em; margin: 0; letter-spacing: 2px;}
        #winnerText { font-size: 4em; font-weight: 900; margin: 20px 0; text-transform: uppercase; text-shadow: 3px 3px 0 #8B0000; word-wrap: break-word;}
        .btn-modal { padding: 12px 25px; font-size: 1.1em; font-weight: 900; border-radius: 30px; cursor: pointer; border: 2px solid #FFD700; margin: 0 10px; transition: 0.3s;}
        .btn-modal-primary { background: #FFD700; color: #8B0000; }
        .btn-modal-primary:hover { background: #FFF; box-shadow: 0 0 20px #FFD700; transform: translateY(-2px); }
        .btn-modal-secondary { background: transparent; color: #FFD700; }
        .btn-modal-secondary:hover { background: rgba(255,215,0,0.2); }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="layout">
        <div class="top-spacer"></div>
        <div class="main-content">
            <div class="wheel-wrapper">
                <canvas id="wheelCanvas" width="800" height="800"></canvas>
                <div class="pointer"><svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bgRed" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E63946" /><stop offset="50%" stop-color="#8B0000" /><stop offset="100%" stop-color="#3E0000" /></linearGradient><linearGradient id="bgGold" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFF4CA" /><stop offset="50%" stop-color="#FFD700" /><stop offset="100%" stop-color="#B8860B" /></linearGradient><filter id="shadow"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.6"/></filter></defs><g filter="url(#shadow)"><ellipse cx="100" cy="270" rx="50" ry="15" fill="url(#bgRed)" stroke="url(#bgGold)" stroke-width="3"/><rect x="90" y="200" width="20" height="70" fill="url(#bgRed)" /><rect x="85" y="240" width="30" height="10" fill="url(#bgGold)" /><path d="M 55 120 v 40 a 45 45 0 0 0 90 0 v -40" fill="none" stroke="url(#bgRed)" stroke-width="12" stroke-linecap="round"/><path d="M 55 120 v 40 a 45 45 0 0 0 90 0 v -40" fill="none" stroke="url(#bgGold)" stroke-width="4" stroke-linecap="round"/><circle cx="55" cy="120" r="12" fill="url(#bgGold)"/><circle cx="145" cy="120" r="12" fill="url(#bgGold)"/><rect x="85" y="200" width="30" height="15" fill="url(#bgGold)" rx="5"/><rect x="60" y="20" width="80" height="120" rx="40" fill="url(#bgRed)" /><rect x="68" y="28" width="64" height="104" rx="32" fill="none" stroke="url(#bgGold)" stroke-width="4"/><line x1="62" y1="50" x2="138" y2="50" stroke="url(#bgGold)" stroke-width="4"/><line x1="60" y1="65" x2="140" y2="65" stroke="url(#bgGold)" stroke-width="4"/><line x1="60" y1="80" x2="140" y2="80" stroke="url(#bgGold)" stroke-width="4"/><line x1="60" y1="95" x2="140" y2="95" stroke="url(#bgGold)" stroke-width="4"/><line x1="62" y1="110" x2="138" y2="110" stroke="url(#bgGold)" stroke-width="4"/><line x1="85" y1="25" x2="85" y2="135" stroke="url(#bgGold)" stroke-width="5"/><line x1="115" y1="25" x2="115" y2="135" stroke="url(#bgGold)" stroke-width="5"/></g></svg></div>
                <button class="spin-btn" id="spinBtn">QUAY</button>
            </div>
            <div class="sidebar">
                <div class="panel">
                    <h2>Chờ quay <span id="waitCount">0</span></h2>
                    <textarea id="nameList" spellcheck="false">Người số 1
Người số 2
Người số 3
Người số 4
Người số 5</textarea>
                    <button id="updateBtn" class="btn-action">Cập nhật</button>
                </div>
                <div class="panel">
                    <h2>Đã trúng thưởng <span id="winCount">0</span></h2>
                    <textarea id="winnerList" spellcheck="false" readonly></textarea>
                    <button id="copyWinnersBtn" class="btn-action btn-success">Copy Danh Sách</button>
                </div>
            </div>
        </div>
    </div>

    <div id="winnerModal" class="modal">
        <div class="modal-content">
            <h2 class="glow-text">✨ CHÚC MỪNG ✨</h2>
            <p id="winnerText">TÊN</p>
            <div style="margin-top:20px;">
                <button id="acceptModal" class="btn-modal btn-modal-primary">Lưu & Xóa tên</button>
                <button id="closeModal" class="btn-modal btn-modal-secondary">Đóng (Quay thử)</button>
            </div>
        </div>
    </div>

    <script>
        const wheelCanvas = document.getElementById('wheelCanvas');
        const ctx = wheelCanvas.getContext('2d');
        const textarea = document.getElementById('nameList');
        const winnerTextarea = document.getElementById('winnerList');
        let names = [];
        let currentAngle = 0;
        let isSpinning = false;
        let spinVelocity = 0;
        let winningIndex = -1;
        const themeColors = ["#C8102E", "#D4AC0D", "#8B0000", "#E67E22", "#900C3F", "#F39C12", "#581845", "#F1C40F"];
        
        let audioCtx = null;
        let lastTickTime = 0, lastSlice = -1;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTick() {
            if (!audioCtx) return;
            const now = Date.now();
            if (now - lastTickTime < 30) return; 
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.03);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
                osc.start(); osc.stop(audioCtx.currentTime + 0.03);
                lastTickTime = now;
            } catch(e) {}
        }

        function updateNames() {
            names = textarea.value.split('\n').map(n => n.trim()).filter(n => n !== '');
            if (names.length === 0) names = ['Trống'];
            document.getElementById('waitCount').textContent = names.length;
            document.getElementById('winCount').textContent = winnerTextarea.value.split('\n').filter(n=>n.trim()!=='').length;
            drawWheel();
        }

        function drawWheel() {
            ctx.clearRect(0, 0, wheelCanvas.width, wheelCanvas.height);
            const numSlices = names.length;
            const sliceAngle = 2 * Math.PI / numSlices;
            const radius = wheelCanvas.width / 2;

            for (let i = 0; i < numSlices; i++) {
                const startAngle = currentAngle + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;
                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, startAngle, endAngle);
                ctx.fillStyle = themeColors[i % themeColors.length];
                ctx.fill();
                if (numSlices <= 100) {
                    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,215,0,0.4)"; ctx.stroke();
                }
                const arcLength = sliceAngle * radius; 
                let fontSize = Math.min(36, arcLength * 0.8);
                
                if (fontSize >= 12 && names[i] !== 'Trống') {
                    ctx.save();
                    ctx.translate(radius, radius);
                    ctx.rotate(startAngle + sliceAngle / 2);
                    ctx.textAlign = "right"; ctx.textBaseline = "middle";
                    ctx.fillStyle = "#FFF"; ctx.font = "900 " + fontSize + "px 'Montserrat', sans-serif";
                    ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 5; ctx.shadowOffsetX=2; ctx.shadowOffsetY=2;
                    let text = names[i];
                    const maxLength = numSlices > 50 ? 12 : 24; 
                    if (text.length > maxLength) text = text.substring(0, maxLength - 2) + '..';
                    ctx.fillText(text, radius - 45, 0);
                    ctx.restore();
                }
            }
        }

        function spin() {
            if (isSpinning || names.length === 0 || names[0] === 'Trống') return;
            initAudio();
            isSpinning = true;
            spinVelocity = Math.random() * 0.15 + 0.35;
            animate();
        }

        function animate() {
            if (spinVelocity > 0.001) {
                currentAngle += spinVelocity;
                spinVelocity *= 0.985;
                const sliceAngle = 2 * Math.PI / names.length;
                let normalizedAngle = currentAngle % (2 * Math.PI);
                let currentSlice = Math.floor(((2 * Math.PI) - normalizedAngle) / sliceAngle) % names.length;
                if (currentSlice !== lastSlice) { playTick(); lastSlice = currentSlice; }
                drawWheel();
                requestAnimationFrame(animate);
            } else {
                isSpinning = false;
                const sliceAngle = 2 * Math.PI / names.length;
                let normalizedAngle = currentAngle % (2 * Math.PI);
                winningIndex = Math.floor(((2 * Math.PI) - normalizedAngle) / sliceAngle) % names.length;
                document.getElementById('winnerText').textContent = names[winningIndex];
                document.getElementById('winnerModal').classList.add('active');
            }
        }

        document.getElementById('updateBtn').addEventListener('click', updateNames);
        textarea.addEventListener('input', updateNames);
        document.getElementById('spinBtn').addEventListener('click', spin);
        
        document.getElementById('acceptModal').addEventListener('click', () => {
            if (winningIndex !== -1 && names[winningIndex] !== 'Trống') {
                const currentWinners = winnerTextarea.value;
                winnerTextarea.value = (currentWinners ? currentWinners + '\n' : '') + names[winningIndex];
                names.splice(winningIndex, 1);
                textarea.value = names.join('\n');
                updateNames();
            }
            document.getElementById('winnerModal').classList.remove('active');
        });
        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('winnerModal').classList.remove('active');
        });
        document.getElementById('copyWinnersBtn').addEventListener('click', () => {
            winnerTextarea.select(); document.execCommand('copy');
            const btn = document.getElementById('copyWinnersBtn');
            const originalText = btn.textContent;
            btn.textContent = 'Đã Copy ✔️';
            setTimeout(() => { btn.textContent = originalText; }, 2000);
        });
        updateNames();
    </script>
</body>
</html>
