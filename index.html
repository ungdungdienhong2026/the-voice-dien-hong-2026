            background-size: cover;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 20%, rgba(0,0,0,0.8) 100%);
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            gap: 40px;
        }
        .wheel-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 700px;
            aspect-ratio: 1 / 1;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 15px solid #FFD700;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.8), inset 0 0 30px rgba(0,0,0,0.8);
            box-sizing: border-box;
            background: #000;
        }
        .pointer { position: absolute; top: 50%; right: -50px; transform: translateY(-50%) rotate(-90deg); width: 110px; height: 150px; z-index: 20; transform-origin: center; } .pointer svg { width: 100%; height: 100%; filter: drop-shadow(0px 0px 10px rgba(255,215,0,0.8)); }
        .spin-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFDF00, #DAA520);
            border: 6px solid #FFF;
            color: #8B0000;
            font-weight: 900;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            z-index: 15;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .spin-btn:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.9);
        }
        .spin-btn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* Sidebar chia làm 2 phần: Chờ quay & Trúng thưởng */
        .sidebar {
            width: 420px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .panel {
            flex: 1;
            background: rgba(20, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid #FFD700;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .panel h2 {
            color: #FFD700;
            text-align: center;
            margin: 0;
            text-transform: uppercase;
            font-size: 1.3em;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
            padding-bottom: 10px;
            letter-spacing: 1px;
        }
        .panel h2 span {
            color: #FFF;
            background: #8B0000;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.9em;
        }
        textarea {
            width: 100%;
            flex: 1;
            background: rgba(0,0,0,0.6);
            color: #FFF;
            border: 1px solid rgba(255, 215, 0, 0.5);
            border-radius: 10px;
            padding: 15px;
            font-size: 1.1em;
            font-family: inherit;
            line-height: 1.6;
            resize: none;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        textarea:focus {
            border-color: #FFD700;
        }
        #winnerList {
            color: #FFDF00; /* Nhấn mạnh người thắng */
            font-weight: 600;
        }
        .btn-action {
            background: linear-gradient(90deg, #8B0000, #E63946);
            color: #FFF;
            border: 2px solid #FFD700;
            padding: 12px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-action:hover {
            background: linear-gradient(90deg, #E63946, #FF4500);
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.6);
        }
        .btn-success {
            background: linear-gradient(90deg, #136a8a, #267871);
            border-color: #48c6ef;
        }
        .btn-success:hover {
            background: linear-gradient(90deg, #267871, #48c6ef);
            box-shadow: 0 0 20px rgba(72, 198, 239, 0.6);
        }

        /* Modal hiển thị người chiến thắng */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        .modal.active {
            display: flex;
            animation: fadeIn 0.4s ease-out;
        }
        .modal-content {
            background: linear-gradient(145deg, #4a0000, #1a0000);
            padding: 50px 60px;
            border-radius: 25px;
            border: 4px solid #FFD700;
            text-align: center;
            box-shadow: 0 20px 50px rgba(255, 215, 0, 0.3);
            transform: scale(0.8);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
            max-width: 800px;
            width: 90%;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { to { transform: scale(1); } }

        .glow-text {
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255,215,0,0.8), 0 0 20px rgba(255,140,0,0.8);
            font-size: 2.5em;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        #winnerText {
            font-size: 4em;
            font-weight: 900;
            color: #FFF;
            margin: 25px 0;
            text-transform: uppercase;
            text-shadow: 3px 3px 0 #8B0000, 0 0 30px rgba(255,255,255,0.6);
            word-wrap: break-word;
        }
        
        .modal-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }
        .btn-modal {
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 3px solid #FFD700;
        }
        .btn-modal-primary {
            background: #FFD700;
            color: #8B0000;
        }
        .btn-modal-primary:hover {
            background: #FFF;
            box-shadow: 0 0 25px #FFD700;
            transform: translateY(-2px);
        }
        .btn-modal-secondary {
            background: transparent;
            color: #FFD700;
        }
        .btn-modal-secondary:hover {
            background: rgba(255, 215, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <!-- Khu vực Vòng Quay -->
        <div class="wheel-section">
            <div class="wheel-wrapper">
                <canvas id="wheelCanvas" width="900" height="900"></canvas>
                <div class="pointer"><svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bgRed" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E63946" /><stop offset="50%" stop-color="#8B0000" /><stop offset="100%" stop-color="#3E0000" /></linearGradient><linearGradient id="bgGold" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFF4CA" /><stop offset="50%" stop-color="#FFD700" /><stop offset="100%" stop-color="#B8860B" /></linearGradient><filter id="shadow"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.6"/></filter></defs><g filter="url(#shadow)"><ellipse cx="100" cy="270" rx="50" ry="15" fill="url(#bgRed)" stroke="url(#bgGold)" stroke-width="3"/><rect x="90" y="200" width="20" height="70" fill="url(#bgRed)" /><rect x="85" y="240" width="30" height="10" fill="url(#bgGold)" /><path d="M 55 120 v 40 a 45 45 0 0 0 90 0 v -40" fill="none" stroke="url(#bgRed)" stroke-width="12" stroke-linecap="round"/><path d="M 55 120 v 40 a 45 45 0 0 0 90 0 v -40" fill="none" stroke="url(#bgGold)" stroke-width="4" stroke-linecap="round"/><circle cx="55" cy="120" r="12" fill="url(#bgGold)"/><circle cx="145" cy="120" r="12" fill="url(#bgGold)"/><rect x="85" y="200" width="30" height="15" fill="url(#bgGold)" rx="5"/><rect x="60" y="20" width="80" height="120" rx="40" fill="url(#bgRed)" /><rect x="68" y="28" width="64" height="104" rx="32" fill="none" stroke="url(#bgGold)" stroke-width="4"/><line x1="62" y1="50" x2="138" y2="50" stroke="url(#bgGold)" stroke-width="4"/><line x1="60" y1="65" x2="140" y2="65" stroke="url(#bgGold)" stroke-width="4"/><line x1="60" y1="80" x2="140" y2="80" stroke="url(#bgGold)" stroke-width="4"/><line x1="60" y1="95" x2="140" y2="95" stroke="url(#bgGold)" stroke-width="4"/><line x1="62" y1="110" x2="138" y2="110" stroke="url(#bgGold)" stroke-width="4"/><line x1="85" y1="25" x2="85" y2="135" stroke="url(#bgGold)" stroke-width="5"/><line x1="115" y1="25" x2="115" y2="135" stroke="url(#bgGold)" stroke-width="5"/></g></svg></div>
                <button class="spin-btn" id="spinBtn">QUAY</button>
            </div>
        </div>
        
        <!-- Sidebar quản lý danh sách -->
        <div class="sidebar">
            <div class="panel">
                <h2>Chờ quay <span id="waitCount">0</span></h2>
                <!-- Chứa 300+ tên bình thường -->
                <textarea id="nameList" spellcheck="false">Người số 1
Người số 2
Người số 3
Người số 4
Người số 5</textarea>
                <button id="updateBtn" class="btn-action">Cập nhật vòng quay</button>
            </div>
            <div class="panel">
                <h2>Đã trúng thưởng <span id="winCount">0</span></h2>
                <textarea id="winnerList" spellcheck="false" readonly placeholder="Những người trúng thưởng sẽ hiển thị ở đây..."></textarea>
                <button id="copyWinnersBtn" class="btn-action btn-success">Copy Danh Sách</button>
            </div>
        </div>
    </div>

    <!-- Modal chúc mừng -->
    <div id="winnerModal" class="modal">
        <div class="modal-content">
            <h2 class="glow-text">✨ CHÚC MỪNG ✨</h2>
            <p id="winnerText">TÊN NGƯỜI TRÚNG</p>
            
            <div class="modal-actions">
                <!-- Nút này sẽ lưu kết quả và xoá người đó khỏi vòng quay -->
                <button id="acceptModal" class="btn-modal btn-modal-primary">🎁 Lưu & Bỏ thăm tiếp</button>
                <!-- Nút này chỉ đóng, dùng để quay thử -->
                <button id="closeModal" class="btn-modal btn-modal-secondary">Đóng (Quay thử)</button>
            </div>
        </div>
    </div>

    <script>
        const wheelCanvas = document.getElementById('wheelCanvas');
        const ctx = wheelCanvas.getContext('2d');
        const textarea = document.getElementById('nameList');
        const winnerTextarea = document.getElementById('winnerList');
        const updateBtn = document.getElementById('updateBtn');
        const copyWinnersBtn = document.getElementById('copyWinnersBtn');
        const spinBtn = document.getElementById('spinBtn');
        
        const winnerModal = document.getElementById('winnerModal');
        const winnerText = document.getElementById('winnerText');
        const acceptModalBtn = document.getElementById('acceptModal');
        const closeModalBtn = document.getElementById('closeModal');
        
        const waitCountSpan = document.getElementById('waitCount');
        const winCountSpan = document.getElementById('winCount');

        let names = [];
        let winningIndex = -1;
        
        // Tone màu Đỏ - Vàng chủ đạo
        const themeColors = [
            "#C8102E", "#D4AC0D", "#8B0000", "#E67E22",
            "#900C3F", "#F39C12", "#581845", "#F1C40F"
        ];

        let currentAngle = 0;
        let isSpinning = false;
        let spinVelocity = 0;
        const friction = 0.985;
        let lastSlice = -1;
        let audioCtx = null;
        let lastTickTime = 0;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTick() {
            if (!audioCtx) return;
            const now = Date.now();
            // Giới hạn tốc độ âm thanh (quan trọng khi vòng quay có 300 người)
            if (now - lastTickTime < 30) return; 
            
            try {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.03);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.03);
                lastTickTime = now;
            } catch(e) {}
        }

        function updateCounts() {
            waitCountSpan.textContent = names.length;
            const winCount = winnerTextarea.value.split('\n').filter(n => n.trim() !== '').length;
            winCountSpan.textContent = winCount;
        }

        function updateNames() {
            names = textarea.value.split('\n').map(n => n.trim()).filter(n => n !== '');
            if (names.length === 0) names = ['Trống'];
            updateCounts();
            drawWheel();
        }

        function drawWheel() {
            ctx.clearRect(0, 0, wheelCanvas.width, wheelCanvas.height);
            const numSlices = names.length;
            const sliceAngle = 2 * Math.PI / numSlices;
            const centerX = wheelCanvas.width / 2;
            const centerY = wheelCanvas.height / 2;
            const radius = wheelCanvas.width / 2;

            for (let i = 0; i < numSlices; i++) {
                const startAngle = currentAngle + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                // Vẽ ô màu
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = themeColors[i % themeColors.length];
                ctx.fill();
                
                // Chỉ vẽ viền nếu số người < 100 để tránh bị rối khi quá đông
                if (numSlices <= 100) {
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = "rgba(255, 215, 0, 0.4)";
                    ctx.stroke();
                }

                // Tính toán kích thước chữ để chữ không bị đè lên nhau khi có 300+ người
                const arcLength = sliceAngle * radius; 
                let fontSize = Math.min(34, arcLength * 0.8);

                // Nếu phông chữ quá nhỏ (dưới 12px) thì ẩn chữ để vòng quay đẹp hơn
                if (fontSize >= 12 && names[i] !== 'Trống') {
                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(startAngle + sliceAngle / 2);
                    ctx.textAlign = "right";
                    ctx.textBaseline = "middle";
                    ctx.fillStyle = "#FFF";
                    ctx.font = `900 ${fontSize}px 'Montserrat', sans-serif`;
                    
                    ctx.shadowColor = "rgba(0,0,0,0.8)";
                    ctx.shadowBlur = 4;
                    ctx.shadowOffsetX = 1;
                    ctx.shadowOffsetY = 1;

                    let text = names[i];
                    // Nếu đông người thì chỉ hiển thị chữ viết tắt, nếu ít người thì hiển thị đủ
                    const maxLength = numSlices > 50 ? 10 : 20; 
                    if (text.length > maxLength) text = text.substring(0, maxLength - 2) + '..';
                    
                    ctx.fillText(text, radius - 45, 0);
                    ctx.restore();
                }
            }
        }

        function spin() {
            if (isSpinning || names.length === 0 || names[0] === 'Trống') return;
            initAudio();
            isSpinning = true;
            spinVelocity = Math.random() * 0.15 + 0.35; // Lực quay mạnh
            animate();
        }

        function animate() {
            if (spinVelocity > 0.001) {
                currentAngle += spinVelocity;
                spinVelocity *= friction;

                const sliceAngle = 2 * Math.PI / names.length;
                let normalizedAngle = currentAngle % (2 * Math.PI);
                let currentSlice = Math.floor(((2 * Math.PI) - normalizedAngle) / sliceAngle) % names.length;
                
                if (currentSlice !== lastSlice) {
                    playTick();
                    lastSlice = currentSlice;
                }

                drawWheel();
                requestAnimationFrame(animate);
            } else {
                isSpinning = false;
                determineWinner();
            }
        }

        function determineWinner() {
            const sliceAngle = 2 * Math.PI / names.length;
            let normalizedAngle = currentAngle % (2 * Math.PI);
            winningIndex = Math.floor(((2 * Math.PI) - normalizedAngle) / sliceAngle) % names.length;
            
            winnerText.textContent = names[winningIndex];
            winnerModal.classList.add('active');
        }

        // Xử lý các nút bấm
        updateBtn.addEventListener('click', updateNames);
        textarea.addEventListener('input', updateNames);
        spinBtn.addEventListener('click', spin);

        // Nút LƯU KẾT QUẢ & LOẠI BỎ NGƯỜI ĐÃ TRÚNG
        acceptModalBtn.addEventListener('click', () => {
            if (winningIndex !== -1 && names[winningIndex] !== 'Trống') {
                const winnerName = names[winningIndex];
                
                // Thêm vào danh sách trúng
                const currentWinners = winnerTextarea.value;
                winnerTextarea.value = (currentWinners ? currentWinners + '\n' : '') + winnerName;
                
                // Xoá khỏi danh sách chờ
                names.splice(winningIndex, 1);
                textarea.value = names.join('\n');
                
                // Cập nhật lại giao diện
                updateNames();
            }
            winnerModal.classList.remove('active');
            winningIndex = -1;
        });

        // Nút QUAY THỬ (Không lưu)
        closeModalBtn.addEventListener('click', () => {
            winnerModal.classList.remove('active');
            winningIndex = -1;
        });

        // Nút Copy Danh sách
        copyWinnersBtn.addEventListener('click', () => {
            winnerTextarea.select();
            document.execCommand('copy');
            const originalText = copyWinnersBtn.textContent;
            copyWinnersBtn.textContent = 'Đã Copy ✔️';
            setTimeout(() => {
                copyWinnersBtn.textContent = originalText;
            }, 2000);
        });

        // Khởi tạo
        updateNames();
    </script>
</body>
</html>
