<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Voice Diên Hồng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        html,body{margin:0;padding:0;background:#1a0303;}
        body{display:flex;flex-direction:column;min-height:100vh;font-family:'Be Vietnam Pro',sans-serif;color:#fff8ec;position:relative;overflow:hidden;background:radial-gradient(1200px 700px at 50% -10%, #8f1206 0%, #5c0a05 40%, #2a0403 75%, #170202 100%);}
        a{color:#ffd24a;} a:hover{color:#ffe27a;}
        @keyframes beamSweep{0%{transform:rotate(-8deg);opacity:.5}50%{transform:rotate(8deg);opacity:.9}100%{transform:rotate(-8deg);opacity:.5}}
        @keyframes beamSweep2{0%{transform:rotate(10deg);opacity:.8}50%{transform:rotate(-6deg);opacity:.4}100%{transform:rotate(10deg);opacity:.8}}
        @keyframes floatGlow{0%,100%{opacity:.35}50%{opacity:.8}}
        @keyframes winnerPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
        @keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
        @keyframes pulseBtn{0%,100%{box-shadow:0 0 0 0 rgba(255,210,74,.55),0 10px 40px rgba(0,0,0,.5)}50%{box-shadow:0 0 0 22px rgba(255,210,74,0),0 10px 40px rgba(0,0,0,.5)}}
        ::-webkit-scrollbar{width:10px} ::-webkit-scrollbar-thumb{background:#7a2c14;border-radius:8px} ::-webkit-scrollbar-track{background:rgba(0,0,0,.3)}
        
        .beam { position:absolute; transform-origin:top center; pointer-events:none; }
        .b1 { top:-12%; left:8%; width:340px; height:130%; background:linear-gradient(to bottom, rgba(255,214,120,.28), transparent 70%); animation:beamSweep 7s ease-in-out infinite; filter:blur(6px); }
        .b2 { top:-12%; left:30%; width:220px; height:130%; background:linear-gradient(to bottom, rgba(255,80,60,.20), transparent 65%); animation:beamSweep2 11s ease-in-out infinite; filter:blur(8px); }
        .b3 { top:-12%; right:28%; width:220px; height:130%; background:linear-gradient(to bottom, rgba(255,190,90,.18), transparent 65%); animation:beamSweep 9.5s ease-in-out infinite reverse; filter:blur(8px); }
        .b4 { top:-12%; right:10%; width:300px; height:130%; background:linear-gradient(to bottom, rgba(255,120,80,.24), transparent 70%); animation:beamSweep2 9s ease-in-out infinite; filter:blur(6px); }
        
        .title-text {
            margin:6px 0 0; font-size:clamp(38px,4.6vw,72px); font-weight:900; line-height:1.05; letter-spacing:.02em; text-transform:uppercase;
            background:linear-gradient(110deg,#ffe9a8 20%,#ffd24a 40%,#fff6d8 50%,#e8a013 60%,#ffe9a8 80%);
            background-size:200% auto; -webkit-background-clip:text; color:transparent; animation:shimmer 6s linear infinite; text-shadow:0 0 60px rgba(255,180,60,.25);
        }
        .panel {
            background:linear-gradient(180deg, rgba(46,4,3,.92), rgba(26,2,2,.92)); border:1.5px solid rgba(255,210,74,.55);
            border-radius:20px; padding:20px 22px; box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,230,160,.15);
        }
        button { outline:none; transition:transform 0.1s, filter 0.1s; }
        button:active { transform:scale(0.96) !important; }
    </style>
</head>
<body>
    <canvas id="bgCanvas" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;"></canvas>
    <div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div><div class="beam b4"></div>
    <div style="position:absolute;top:0;left:0;bottom:0;width:16%;background:linear-gradient(to right, rgba(50,2,2,.85), transparent);pointer-events:none;z-index:1;"></div>
    <div style="position:absolute;top:0;right:0;bottom:0;width:16%;background:linear-gradient(to left, rgba(50,2,2,.85), transparent);pointer-events:none;z-index:1;"></div>
    
    <header style="text-align:center;padding:26px 20px 6px;position:relative;z-index:2;">
        <div style="font-size:20px;font-weight:800;letter-spacing:.42em;color:#ffb3a0;text-transform:uppercase;">Đêm chung kết · 2026</div>
        <h1 class="title-text">The Voice Diên Hồng</h1>
        <div style="margin-top:8px;display:inline-block;font-size:clamp(18px,1.6vw,26px);font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:#fff;padding:8px 28px;border:1px solid rgba(255,210,74,.5);border-radius:999px;background:rgba(120,10,5,.45);">✦ Vòng quay may mắn ✦</div>
    </header>

    <main style="flex:1;display:flex;gap:32px;align-items:stretch;justify-content:center;padding:10px 40px 34px;position:relative;z-index:2;flex-wrap:wrap;">
        <!-- WHEEL -->
        <div id="wrapRef" style="flex:1 1 560px;min-width:340px;max-width:1000px;position:relative;display:flex;align-items:center;justify-content:center;">
            <canvas id="wheelCanvas" style="display:block;"></canvas>
            
            <!-- SVG Pointer Retro Mic -->
            <div id="pointer" style="position:absolute;left:50%;top:50%;height:100px;width:66px;transform-origin:left center;transform:translate(0%, -50%) rotate(0deg);pointer-events:none;z-index:3;filter:drop-shadow(0 0 20px rgba(255,210,80,1)) drop-shadow(0 4px 10px rgba(0,0,0,.8));">
                <svg viewBox="0 0 200 300" style="width:100%;height:100%;transform:rotate(-90deg);"><defs><linearGradient id="bgRed" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E63946" /><stop offset="50%" stop-color="#8B0000" /><stop offset="100%" stop-color="#3E0000" /></linearGradient><linearGradient id="bgGold" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFF4CA" /><stop offset="50%" stop-color="#FFD700" /><stop offset="100%" stop-color="#B8860B" /></linearGradient></defs><g><ellipse cx="100" cy="270" rx="50" ry="15" fill="url(#bgRed)" stroke="url(#bgGold)" stroke-width="3"/><rect x="90" y="200" width="20" height="70" fill="url(#bgRed)" /><rect x="85" y="240" width="30" height="10" fill="url(#bgGold)" /><path d="M 55 120 v 40 a 45 45 0 0 0 90 0 v -40" fill="none" stroke="url(#bgRed)" stroke-width="12" stroke-linecap="round"/><path d="M 55 120 v 40 a 45 45 0 0 0 90 0 v -40" fill="none" stroke="url(#bgGold)" stroke-width="4" stroke-linecap="round"/><circle cx="55" cy="120" r="12" fill="url(#bgGold)"/><circle cx="145" cy="120" r="12" fill="url(#bgGold)"/><rect x="85" y="200" width="30" height="15" fill="url(#bgGold)" rx="5"/><rect x="60" y="20" width="80" height="120" rx="40" fill="url(#bgRed)" /><rect x="68" y="28" width="64" height="104" rx="32" fill="none" stroke="url(#bgGold)" stroke-width="4"/><line x1="62" y1="50" x2="138" y2="50" stroke="url(#bgGold)" stroke-width="4"/><line x1="60" y1="65" x2="140" y2="65" stroke="url(#bgGold)" stroke-width="4"/><line x1="60" y1="80" x2="140" y2="80" stroke="url(#bgGold)" stroke-width="4"/><line x1="60" y1="95" x2="140" y2="95" stroke="url(#bgGold)" stroke-width="4"/><line x1="62" y1="110" x2="138" y2="110" stroke="url(#bgGold)" stroke-width="4"/><line x1="85" y1="25" x2="85" y2="135" stroke="url(#bgGold)" stroke-width="5"/><line x1="115" y1="25" x2="115" y2="135" stroke="url(#bgGold)" stroke-width="5"/></g></svg>
            </div>
            
            <button id="spinBtn" title="Bấm hoặc nhấn phím cách để quay" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(96px,11vw,150px);height:clamp(96px,11vw,150px);border-radius:50%;border:6px solid #fff3cf;cursor:pointer;background:radial-gradient(circle at 35% 30%, #ffe9a0, #f2b722 55%, #c07908 100%);color:#5a2c00;font-family:'Be Vietnam Pro',sans-serif;font-weight:900;font-size:clamp(24px,2.4vw,38px);letter-spacing:.05em;animation:pulseBtn 2.2s ease-out infinite;display:flex;align-items:center;justify-content:center;padding:0;z-index:10;" onmouseover="this.style.transform='translate(-50%,-50%) scale(1.06)'" onmouseout="this.style.transform='translate(-50%,-50%) scale(1)'">QUAY</button>
        </div>

        <!-- SIDEBAR -->
        <aside style="width:400px;flex:0 1 400px;min-width:320px;display:flex;flex-direction:column;gap:22px;justify-content:center;">
            <section class="panel">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;">
                    <h2 style="margin:0;font-size:22px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#ffd24a;">Chờ quay</h2>
                    <span id="nameCount" style="min-width:38px;text-align:center;padding:4px 12px;border-radius:999px;background:#c1121f;color:#fff;font-weight:900;font-size:18px;box-shadow:0 0 14px rgba(255,60,40,.6);">0</span>
                </div>
                <textarea id="namesText" spellcheck="false" placeholder="Mỗi dòng một tên..." style="width:100%;box-sizing:border-box;height:210px;resize:vertical;background:rgba(0,0,0,.45);border:1px solid rgba(255,210,74,.3);border-radius:12px;color:#fff4dc;font-family:'Be Vietnam Pro',sans-serif;font-size:17px;line-height:1.6;padding:12px 14px;outline:none;">Người số 1
Người số 2
Người số 3
Người số 4
Người số 5
Người số 6
Người số 7
Người số 8</textarea>
                <button id="applyBtn" style="margin-top:12px;width:100%;padding:13px 0;border:none;border-radius:12px;cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;font-weight:900;font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:linear-gradient(120deg,#e01e2b,#a4161a);box-shadow:0 8px 24px rgba(200,20,20,.4);" onmouseover="this.style.filter='brightness(1.15)'" onmouseout="this.style.filter='none'">Cập nhật vòng quay</button>
            </section>

            <section class="panel">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;">
                    <h2 style="margin:0;font-size:22px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#ffd24a;">Đã trúng thưởng</h2>
                    <span id="winnerCount" style="min-width:38px;text-align:center;padding:4px 12px;border-radius:999px;background:#0f7d5c;color:#fff;font-weight:900;font-size:18px;box-shadow:0 0 14px rgba(30,220,140,.45);">0</span>
                </div>
                <div id="winnersList" style="height:170px;overflow-y:auto;background:rgba(0,0,0,.45);border:1px solid rgba(255,210,74,.3);border-radius:12px;padding:8px 12px;">
                    <div id="noWinners" style="color:#b07a5a;font-size:16px;padding:14px 4px;font-style:italic;">Người trúng thưởng sẽ hiển thị ở đây...</div>
                </div>
                <button id="copyBtn" style="margin-top:12px;width:100%;padding:13px 0;border:1px solid rgba(255,210,74,.6);border-radius:12px;cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;font-weight:900;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:#ffd24a;background:rgba(120,10,5,.4);" onmouseover="this.style.background='rgba(255,210,74,.15)'" onmouseout="this.style.background='rgba(120,10,5,.4)'">Copy danh sách</button>
            </section>
        </aside>
    </main>

    <!-- WINNER MODAL -->
    <div id="winnerModal" style="display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;background:radial-gradient(ellipse at center, rgba(90,6,4,.88), rgba(10,0,0,.96));backdrop-filter:blur(6px);">
        <div style="text-align:center;animation:winnerPop .55s cubic-bezier(.2,1.4,.4,1) both;max-width:90vw;">
            <div style="font-size:clamp(22px,2.4vw,34px);font-weight:800;letter-spacing:.5em;text-transform:uppercase;color:#ffb3a0;animation:floatGlow 2s ease-in-out infinite;">🎉 Chúc mừng 🎉</div>
            <div style="margin:26px auto;padding:clamp(30px,4vw,60px) clamp(40px,6vw,100px);border:3px solid #ffd24a;border-radius:28px;background:linear-gradient(180deg, rgba(60,5,3,.9), rgba(30,2,2,.9));box-shadow:0 0 120px rgba(255,180,60,.35), inset 0 0 60px rgba(255,180,60,.08);">
                <div id="winnerText" class="title-text" style="font-size:clamp(52px,8vw,150px); animation:shimmer 4s linear infinite;"></div>
            </div>
            <div style="display:flex;gap:18px;justify-content:center;flex-wrap:wrap;">
                <button id="removeWinnerBtn" style="padding:16px 36px;border:none;border-radius:14px;cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;font-weight:900;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:#5a2c00;background:linear-gradient(120deg,#ffe9a0,#f2b722);box-shadow:0 10px 30px rgba(255,180,40,.4);" onmouseover="this.style.filter='brightness(1.1)'" onmouseout="this.style.filter='none'">Xóa khỏi vòng quay</button>
                <button id="keepWinnerBtn" style="padding:16px 36px;border:1.5px solid rgba(255,210,74,.6);border-radius:14px;cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;font-weight:800;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:#ffd24a;background:rgba(60,5,3,.6);" onmouseover="this.style.background='rgba(255,210,74,.12)'" onmouseout="this.style.background='rgba(60,5,3,.6)'">Giữ lại trên vòng</button>
            </div>
        </div>
    </div>

    <canvas id="confettiCanvas" style="position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60;"></canvas>

    <script>
        // --- UI State & Data ---
        let names = [];
        let winners = [];
        let spinning = false;
        let currentAngle = 0;
        let targetWinnerIndex = -1;
        let rafId = 0;
        let lastSeg = -1;
        
        // Nodes
        const txtNames = document.getElementById('namesText');
        const cv = document.getElementById('wheelCanvas');
        const ctx = cv.getContext('2d');
        const wrap = document.getElementById('wrapRef');
        const micPointer = document.getElementById('pointer');
        const waitCount = document.getElementById('nameCount');
        const winCount = document.getElementById('winnerCount');
        const winListEl = document.getElementById('winnersList');
        const noWinnersEl = document.getElementById('noWinners');
        
        const palettes = ["#a4161a","#e85d04","#ffba08","#d00000","#6a040f","#f48c06"];

        // --- Background Animations ---
        const bgCv = document.getElementById('bgCanvas');
        const bgCtx = bgCv.getContext('2d');
        let sparkles = [], bokeh = [];
        
        function initBg() {
            bgCv.width = bgCv.offsetWidth; bgCv.height = bgCv.offsetHeight;
            const W = bgCv.width, H = bgCv.height;
            sparkles = Array.from({ length: 70 }, () => ({
                x: Math.random() * W, y: Math.random() * H,
                r: 0.8 + Math.random() * 2.2, sp: 0.15 + Math.random() * 0.5,
                sw: Math.random() * Math.PI * 2, tw: 0.5 + Math.random() * 1.5
            }));
            bokeh = Array.from({ length: 12 }, () => ({
                x: Math.random() * W, y: Math.random() * H,
                r: 30 + Math.random() * 70, ph: Math.random() * Math.PI * 2,
                hue: Math.random() < 0.5 ? "255,180,70" : "255,90,60"
            }));
        }
        window.addEventListener('resize', initBg);
        initBg();

        // --- Confetti ---
        const confCv = document.getElementById('confettiCanvas');
        const confCtx = confCv.getContext('2d');
        let particles = [];
        function burst() {
            confCv.width = window.innerWidth; confCv.height = window.innerHeight;
            particles = [];
            const cols = ["#ffd24a", "#ffffff", "#e01e2b", "#f2b722", "#ff8f5a"];
            for (let i = 0; i < 220; i++) {
                particles.push({
                    x: confCv.width / 2 + (Math.random() - 0.5) * confCv.width * 0.3,
                    y: confCv.height * 0.25,
                    vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 14 - 4,
                    w: 6 + Math.random() * 8, h: 10 + Math.random() * 8,
                    rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
                    c: cols[Math.floor(Math.random() * cols.length)], life: 1
                });
            }
        }

        // --- Audio ---
        let ac;
        function initAudio() {
            if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
            if (ac && ac.state === "suspended") ac.resume();
        }
        function playTick() {
            if (!ac) return;
            const o = ac.createOscillator(), g = ac.createGain();
            o.type = "square"; o.frequency.value = 1600;
            g.gain.setValueAtTime(0.08, ac.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.04);
            o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05);
        }
        function playFanfare() {
            if (!ac) return;
            [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
                const o = ac.createOscillator(), g = ac.createGain();
                o.type = "triangle"; o.frequency.value = f;
                const t0 = ac.currentTime + i * 0.12;
                g.gain.setValueAtTime(0.0001, t0);
                g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02);
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.8);
                o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + 0.85);
            });
        }

        // --- Wheel Rendering ---
        function resizeWheel() {
            const s = Math.min(wrap.clientWidth, wrap.clientHeight, 860);
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            cv.width = s * dpr; cv.height = s * dpr;
            cv.style.width = s + "px"; cv.style.height = s + "px";
            micPointer.style.left = `calc(50% + ${s/2 - s*0.05}px)`;
            micPointer.style.height = `${s*0.17}px`;
            drawWheel();
        }
        window.addEventListener('resize', resizeWheel);

        function applyNames() {
            const arr = txtNames.value.split("\n").map(x => x.trim()).filter(Boolean);
            names = arr.length ? arr : ["Thêm tên vào danh sách!"];
            waitCount.textContent = names.length;
            drawWheel();
        }
        document.getElementById('applyBtn').onclick = applyNames;

        function renderWinners() {
            winCount.textContent = winners.length;
            if (winners.length === 0) {
                winListEl.innerHTML = `<div id="noWinners" style="color:#b07a5a;font-size:16px;padding:14px 4px;font-style:italic;">Người trúng thưởng sẽ hiển thị ở đây...</div>`;
            } else {
                winListEl.innerHTML = winners.map(w => `
                    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 4px;border-bottom:1px dashed rgba(255,210,74,.18);">
                        <span style="font-weight:800;font-size:18px;color:#fff;">🏆 ${w.name}</span>
                        <span style="font-size:13px;color:#d9a06b;white-space:nowrap;">${w.time}</span>
                    </div>
                `).join('');
            }
        }

        function drawWheel() {
            const W = cv.width, cx = W / 2, cy = W / 2;
            const R = W / 2 - 8;
            ctx.clearRect(0, 0, W, W);
            const n = Math.max(names.length, 1);
            
            ctx.save(); ctx.translate(cx, cy);
            // Rim
            const rimGrad = ctx.createLinearGradient(-R, -R, R, R);
            rimGrad.addColorStop(0, "#8a5a06"); rimGrad.addColorStop(0.35, "#ffe9a0"); 
            rimGrad.addColorStop(0.5, "#f2b722"); rimGrad.addColorStop(0.7, "#b97a08"); rimGrad.addColorStop(1, "#ffe9a0");
            ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2);
            ctx.fillStyle = rimGrad;
            ctx.shadowColor = "rgba(255,180,60,.45)"; ctx.shadowBlur = W * 0.03;
            ctx.fill(); ctx.shadowBlur = 0;
            
            const rIn = R * 0.9;
            const seg = (Math.PI * 2) / n;
            
            // Slices
            for (let i = 0; i < n; i++) {
                const a0 = currentAngle + i * seg, a1 = a0 + seg;
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, rIn, a0, a1); ctx.closePath();
                ctx.fillStyle = palettes[i % palettes.length];
                if (n % palettes.length === 1 && i === n - 1) ctx.fillStyle = palettes[1];
                ctx.fill();
                ctx.strokeStyle = "rgba(255,240,200,.35)"; ctx.lineWidth = Math.max(1, W * 0.0015); ctx.stroke();
            }
            
            // Inner shadow
            const shade = ctx.createRadialGradient(0, 0, rIn * 0.2, 0, 0, rIn);
            shade.addColorStop(0, "rgba(255,255,255,.10)"); shade.addColorStop(0.75, "rgba(0,0,0,0)"); shade.addColorStop(1, "rgba(0,0,0,.28)");
            ctx.beginPath(); ctx.arc(0, 0, rIn, 0, Math.PI * 2); ctx.fillStyle = shade; ctx.fill();
            
            // Text
            if (n <= 80) {
                const fs = Math.max(W * 0.014, Math.min(W * 0.05, (rIn * 2.6) / n));
                ctx.font = "800 " + fs + "px 'Be Vietnam Pro', sans-serif";
                ctx.textAlign = "right"; ctx.textBaseline = "middle";
                for (let i = 0; i < n; i++) {
                    const mid = currentAngle + (i + 0.5) * seg;
                    ctx.save(); ctx.rotate(mid);
                    ctx.fillStyle = "#ffffff";
                    ctx.shadowColor = "rgba(0,0,0,.55)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
                    let label = names[i] || "";
                    const maxW = rIn * 0.62;
                    while (ctx.measureText(label).width > maxW && label.length > 2) label = label.slice(0, -2) + "…";
                    ctx.fillText(label, rIn * 0.93, 0);
                    ctx.restore();
                }
            }
            
            // Hub
            const hub = W * 0.105;
            const hg = ctx.createRadialGradient(-hub * 0.3, -hub * 0.3, hub * 0.1, 0, 0, hub);
            hg.addColorStop(0, "#fff3cf"); hg.addColorStop(0.5, "#f2b722"); hg.addColorStop(1, "#b97a08");
            ctx.beginPath(); ctx.arc(0, 0, hub, 0, Math.PI * 2); ctx.fillStyle = hg;
            ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = W * 0.015; ctx.fill();
            ctx.restore();
        }

        // --- Animation Loop ---
        function loop() {
            const t = performance.now();
            // Draw BG
            if (bgCv.width !== bgCv.offsetWidth || bgCv.height !== bgCv.offsetHeight) initBg();
            bgCtx.clearRect(0, 0, bgCv.width, bgCv.height);
            for (const b of bokeh) {
                const a = 0.05 + 0.05 * Math.sin(t / 2400 + b.ph);
                const g = bgCtx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
                g.addColorStop(0, "rgba(" + b.hue + "," + a + ")");
                g.addColorStop(1, "rgba(" + b.hue + ",0)");
                bgCtx.fillStyle = g; bgCtx.beginPath(); bgCtx.arc(b.x, b.y, b.r, 0, Math.PI * 2); bgCtx.fill();
            }
            for (const p of sparkles) {
                p.y -= p.sp; p.x += Math.sin(t / 1600 + p.sw) * 0.3;
                if (p.y < -6) { p.y = bgCv.height + 6; p.x = Math.random() * bgCv.width; }
                const a = 0.35 + 0.45 * Math.sin(t / (400 * p.tw) + p.sw);
                bgCtx.beginPath(); bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                bgCtx.fillStyle = "rgba(255,220,130," + Math.max(a, 0.08) + ")";
                bgCtx.shadowColor = "rgba(255,210,90,.8)"; bgCtx.shadowBlur = 6;
                bgCtx.fill(); bgCtx.shadowBlur = 0;
            }
            
            // Draw Confetti
            confCtx.clearRect(0, 0, confCv.width, confCv.height);
            if (particles.length) {
                particles = particles.filter(p => p.life > 0 && p.y < confCv.height + 30);
                for (const p of particles) {
                    p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.rot += p.vr; p.life -= 0.004;
                    confCtx.save(); confCtx.translate(p.x, p.y); confCtx.rotate(p.rot);
                    confCtx.globalAlpha = Math.max(p.life, 0);
                    confCtx.fillStyle = p.c; confCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    confCtx.restore();
                }
            }
            
            // Wheel Lights & Tick
            if (names.length > 0) {
                const W = cv.width;
                const R = W / 2 - 8;
                const rIn = R * 0.9;
                const bulbs = 20, rb = (R + rIn) / 2 + R * 0.007;
                
                // Re-draw bulbs over the wheel without clearing
                ctx.save(); ctx.translate(W/2, W/2);
                for (let i = 0; i < bulbs; i++) {
                    const a = (i / bulbs) * Math.PI * 2;
                    const on = spinning ? (Math.floor(t / 90) + i) % 2 === 0 : (Math.floor(t / 550) + i) % 2 === 0;
                    ctx.save(); ctx.rotate(a); ctx.translate(R * 0.952, 0);
                    ctx.beginPath(); ctx.arc(0, 0, W * 0.009, 0, Math.PI * 2);
                    ctx.fillStyle = on ? "#fff6d0" : "#9a6a10";
                    if (on) { ctx.shadowColor = "#ffdf80"; ctx.shadowBlur = W * 0.012; }
                    ctx.fill(); ctx.restore();
                }
                ctx.restore();
                
                // Tick logic
                if (spinning) {
                    const seg = (Math.PI * 2) / names.length;
                    const pointerAngle = 0; // Pointing to right (0 radians in Canvas is 3 o'clock)
                    const rel = ((pointerAngle - currentAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
                    const idx = Math.floor((Math.PI * 2 - rel) / seg) % names.length;
                    if (idx !== lastSeg) { lastSeg = idx; playTick(); }
                }
            }
            requestAnimationFrame(loop);
        }

        // --- Interaction ---
        function spin() {
            if (spinning || names.length < 2) return;
            initAudio();
            spinning = true;
            const n = names.length, seg = (Math.PI * 2) / n;
            const target = Math.floor(Math.random() * n);
            const pointerAngle = 0;
            const jitter = (Math.random() * 0.7 + 0.15) * seg;
            const finalAngle = pointerAngle - (target * seg) - jitter;
            const startAngle = currentAngle;
            const norm = ((finalAngle - currentAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
            const dur = 7000;
            const total = norm + Math.PI * 2 * 6; // 6 extra spins
            const t0 = performance.now();
            targetWinnerIndex = target;
            
            const ease = (x) => 1 - Math.pow(1 - x, 4);
            
            function step(now) {
                const p = Math.min((now - t0) / dur, 1);
                currentAngle = startAngle + total * ease(p);
                drawWheel();
                if (p < 1 && spinning) requestAnimationFrame(step);
                else if (spinning) {
                    spinning = false;
                    const wName = names[target];
                    const d = new Date();
                    const time = String(d.getHours()).padStart(2, '0') + ":" + String(d.getMinutes()).padStart(2, '0');
                    winners.unshift({ name: wName, time });
                    document.getElementById('winnerText').textContent = wName;
                    document.getElementById('winnerModal').style.display = 'flex';
                    playFanfare(); burst();
                }
            }
            requestAnimationFrame(step);
        }

        document.getElementById('spinBtn').onclick = spin;
        window.addEventListener('keydown', e => { if (e.code === "Space" && !e.repeat && document.getElementById('winnerModal').style.display !== 'flex') { e.preventDefault(); spin(); } });
        
        document.getElementById('removeWinnerBtn').onclick = () => {
            names.splice(targetWinnerIndex, 1);
            txtNames.value = names.join("\n");
            document.getElementById('winnerModal').style.display = 'none';
            applyNames(); renderWinners();
        };
        document.getElementById('keepWinnerBtn').onclick = () => {
            document.getElementById('winnerModal').style.display = 'none';
            renderWinners();
        };
        document.getElementById('copyBtn').onclick = () => {
            const txt = winners.map(w => w.name).join("\n");
            navigator.clipboard.writeText(txt).then(() => {
                const b = document.getElementById('copyBtn');
                b.textContent = "✓ Đã copy!";
                setTimeout(() => b.textContent = "Copy danh sách", 1500);
            });
        };

        // Init
        applyNames();
        resizeWheel();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
